name: Mock and simulation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sircus/simulation/requirements-viam.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r sircus/simulation/requirements-viam.txt
      - run: python scripts/check-repository.py --tracked
      - run: scripts/test.sh
        env:
          SIRCUS_PYTHON: python
